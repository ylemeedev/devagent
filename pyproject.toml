# Définit comment construire le projet.
[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"

# Décrit DevAgent et ses d�pendances
[project]
name = "devagent"
version = "0.1.0"
description = "Development Officer"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

# Indique ou rechercher les packages Python
[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"